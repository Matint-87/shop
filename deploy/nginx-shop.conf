# مسیر روی سرور: /etc/nginx/sites-available/shop  (و لینک در sites-enabled)
# بعد از ساخت، برای HTTPS اجرا کن:  sudo certbot --nginx -d supermarketrahimi.ir -d www.supermarketrahimi.ir

# www → بدون www
server {
    listen 80;
    listen [::]:80;
    server_name www.supermarketrahimi.ir;
    return 301 https://supermarketrahimi.ir$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name supermarketrahimi.ir;

    client_max_body_size 6m;   # آپلود عکس (سقف برنامه ۴ مگابایته)

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml image/svg+xml;

    # اعلان‌های لحظه‌ای (SSE): نباید بافر یا زود قطع بشه
    location /api/notifications/stream {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # فقط IP واقعی؛ جلوی جعل هدر (rate-limit برنامه به این تکیه داره)
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
